name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "CLOUDET_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CLOUDET_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi
          echo "CLOUDET_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Test and package
        run: ./build.sh --test --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Cloudet-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            macOS 14 or later. Apple Silicon and Intel.

            Download the DMG, open it, and drag **Cloudet** into Applications. The first time, right-click the app and choose Open. This GitHub build is not notarized.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
